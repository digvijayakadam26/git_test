<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager - Professional Task & Project Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">📊 Project Manager</h1>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-filter="all">
                    <span class="nav-icon">📋</span> All Projects
                </button>
                <button class="nav-btn" data-filter="active">
                    <span class="nav-icon">⚡</span> Active
                </button>
                <button class="nav-btn" data-filter="completed">
                    <span class="nav-icon">✅</span> Completed
                </button>
                <button class="nav-btn" data-filter="high-priority">
                    <span class="nav-icon">🔴</span> High Priority
                </button>
            </nav>
            <div class="sidebar-footer">
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Total</span>
                        <span class="stat-value" id="totalProjects">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Active</span>
                        <span class="stat-value" id="activeProjects">0</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="main-header">
                <h2 id="currentView">All Projects</h2>
                <button class="btn btn-primary" id="addProjectBtn">
                    <span>➕</span> New Project
                </button>
            </header>

            <!-- Project Grid -->
            <div class="projects-grid" id="projectsGrid">
                <div class="empty-state">
                    <p>📭 No projects yet. Create your first project!</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for New/Edit Project -->
    <div class="modal" id="projectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Create New Project</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <form id="projectForm">
                <div class="form-group">
                    <label for="projectName">Project Name *</label>
                    <input type="text" id="projectName" required placeholder="Enter project name">
                </div>
                <div class="form-group">
                    <label for="projectDescription">Description</label>
                    <textarea id="projectDescription" placeholder="Project description..." rows="4"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="projectPriority">Priority *</label>
                        <select id="projectPriority" required>
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="projectDueDate">Due Date</label>
                        <input type="date" id="projectDueDate">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Task Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Task</h3>
                <button class="modal-close" id="closeTaskModalBtn">&times;</button>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskName">Task Name *</label>
                    <input type="text" id="taskName" required placeholder="Enter task name">
                </div>
                <div class="form-group">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <input type="hidden" id="taskProjectId">
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelTaskBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Project Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="detailsTitle">Project Details</h3>
                <button class="modal-close" id="closeDetailsBtn">&times;</button>
            </div>
            <div class="details-content">
                <div class="details-header">
                    <div>
                        <p class="details-label">Description</p>
                        <p id="detailsDescription" class="details-text"></p>
                    </div>
                    <div>
                        <p class="details-label">Due Date</p>
                        <p id="detailsDueDate" class="details-text"></p>
                    </div>
                </div>
                
                <div class="tasks-section">
                    <div class="section-header">
                        <h4>Tasks</h4>
                        <button class="btn btn-small" id="addTaskBtn">Add Task</button>
                    </div>
                    <div id="tasksList" class="tasks-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
